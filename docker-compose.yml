services:
  pendencias:
    build: .
    ports:
      - "3939:3939"
    environment:
      PENDENCIAS_DB_PATH: /data/pendencias.db
      PENDENCIAS_SERVER_PORT: 3939
      PENDENCIAS_DEV_RECOVERY: "0"
      PENDENCIAS_ADMIN_EMAIL: ${PENDENCIAS_ADMIN_EMAIL:-admin@pendencias.local}
      PENDENCIAS_ADMIN_SENHA: ${PENDENCIAS_ADMIN_SENHA:-}
      PENDENCIAS_CORS_ORIGIN: ${PENDENCIAS_CORS_ORIGIN:-}
      PENDENCIAS_SMTP_HOST: ${PENDENCIAS_SMTP_HOST:-}
      PENDENCIAS_SMTP_PORT: ${PENDENCIAS_SMTP_PORT:-587}
      PENDENCIAS_SMTP_SECURE: ${PENDENCIAS_SMTP_SECURE:-0}
      PENDENCIAS_SMTP_USER: ${PENDENCIAS_SMTP_USER:-}
      PENDENCIAS_SMTP_PASS: ${PENDENCIAS_SMTP_PASS:-}
      PENDENCIAS_SMTP_FROM: ${PENDENCIAS_SMTP_FROM:-}
    volumes:
      - pendencias-data:/data
    restart: unless-stopped

volumes:
  pendencias-data: